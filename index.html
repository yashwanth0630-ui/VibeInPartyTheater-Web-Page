<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>party-room-app</title>
  </head>
<body>
  <!-- This hidden form tells Netlify what inputs to expect -->
  <form name="booking-form" data-netlify="true" hidden>
    <input type="text" name="admin_customer_name" />
    <input type="email" name="admin_customer_email" />
    <input type="tel" name="admin_phone" />
    <input type="date" name="admin_event_date" />
    <select name="admin_selected_package"></select>
    <input type="number" name="admin_guest_count" />
  </form>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
